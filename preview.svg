<svg xmlns="http://www.w3.org/2000/svg" width="850" height="340" viewBox="0 0 850 340" role="img">
  <title>Soham Bhattacharya GitHub Profile Signal</title>
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="40%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="60%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roamingOrb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="roamingOrb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="innerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Outer background & glowing border -->
  <rect x="1" y="1" width="848" height="338" rx="22" fill="#070913" stroke="url(#cardBorder)" stroke-width="1.5"/>

  <!-- Ambient auras -->
  <rect x="1" y="1" width="848" height="338" rx="22" fill="url(#topGlow)" pointer-events="none"/>
  <rect x="1" y="1" width="848" height="338" rx="22" fill="url(#bottomGlow)" pointer-events="none"/>

  <!-- Animated roaming glowing orbs -->
  <circle cx="200" cy="100" r="140" fill="url(#roamingOrb1)" pointer-events="none">
    <animate attributeName="cx" values="180;680;420;180" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;140;250;90" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="220" r="130" fill="url(#roamingOrb2)" pointer-events="none">
    <animate attributeName="cx" values="640;220;520;640" dur="20s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="220;250;90;220" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Radar signal rings in top right -->
  <g stroke="#10b981" fill="none" stroke-width="1.2" pointer-events="none">
    <circle cx="735" cy="112" r="38" stroke-opacity="0.07"/>
    <circle cx="735" cy="112" r="70" stroke-opacity="0.059500000000000004"/>
    <circle cx="735" cy="112" r="102" stroke-opacity="0.049"/>
    <circle cx="735" cy="112" r="134" stroke-opacity="0.035"/>
  </g>

  <!-- Inner container box -->
  <rect x="34" y="28" width="782" height="264" rx="16" fill="rgba(8, 12, 20, 0.65)" stroke="url(#innerBorder)" stroke-width="1.2"/>

  <!-- Header -->
  <text x="56" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.4">Profile Signal</text>
  <text x="56" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="0.2">Live GitHub developer metrics</text>

  <!-- 4 Stat tiles -->
  
    <g class="stat-tile" transform="translate(0, 0)">
      <rect x="56" y="118" width="174" height="152" rx="14" fill="#090e18" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
      <text x="76" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Stars</text>
      <text x="76" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#38bdf8" letter-spacing="-0.5">7</text>
      <rect x="76" y="232" width="134" height="6" rx="3" fill="#152033"/>
      <rect x="76" y="232" width="8" height="6" rx="3" fill="#38bdf8"/>
    </g>
    <g class="stat-tile" transform="translate(0, 0)">
      <rect x="244" y="118" width="174" height="152" rx="14" fill="#090e18" stroke="rgba(45, 212, 191, 0.35)" stroke-width="1.2"/>
      <text x="264" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Contributions</text>
      <text x="264" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#2dd4bf" letter-spacing="-0.5">435</text>
      <rect x="264" y="232" width="134" height="6" rx="3" fill="#152033"/>
      <rect x="264" y="232" width="23" height="6" rx="3" fill="#2dd4bf"/>
    </g>
    <g class="stat-tile" transform="translate(0, 0)">
      <rect x="432" y="118" width="174" height="152" rx="14" fill="#090e18" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2"/>
      <text x="452" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Repos</text>
      <text x="452" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#c084fc" letter-spacing="-0.5">41</text>
      <rect x="452" y="232" width="134" height="6" rx="3" fill="#152033"/>
      <rect x="452" y="232" width="110" height="6" rx="3" fill="#c084fc"/>
    </g>
    <g class="stat-tile" transform="translate(0, 0)">
      <rect x="620" y="118" width="174" height="152" rx="14" fill="#090e18" stroke="rgba(74, 222, 128, 0.35)" stroke-width="1.2"/>
      <text x="640" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Followers</text>
      <text x="640" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#4ade80" letter-spacing="-0.5">6</text>
      <rect x="640" y="232" width="134" height="6" rx="3" fill="#152033"/>
      <rect x="640" y="232" width="8" height="6" rx="3" fill="#4ade80"/>
    </g>
</svg>