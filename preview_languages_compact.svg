<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240" role="img">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="langBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="langTopGlow" cx="25%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="langBottomGlow" cx="75%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="langOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="langInnerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="segmentedBarClip">
      <rect x="36" y="68" width="448" height="10" rx="6"/>
    </clipPath>
  </defs>

  <!-- Outer background & glowing border -->
  <rect x="1" y="1" width="518" height="238" rx="20" fill="#070913" stroke="url(#langBorder)" stroke-width="1.5"/>

  <!-- Ambient auras -->
  <rect x="1" y="1" width="518" height="238" rx="20" fill="url(#langTopGlow)" pointer-events="none"/>
  <rect x="1" y="1" width="518" height="238" rx="20" fill="url(#langBottomGlow)" pointer-events="none"/>

  <!-- Animated roaming glowing orb -->
  <circle cx="208" cy="100" r="130" fill="url(#langOrb)" pointer-events="none">
    <animate attributeName="cx" values="156;364;208;156" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;150;110;90" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner container box -->
  <rect x="20" y="16" width="480" height="208" rx="14" fill="rgba(8, 12, 20, 0.65)" stroke="url(#langInnerBorder)" stroke-width="1.2"/>

  <!-- Title: Most Used Languages -->
  <text x="36" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#c084fc" letter-spacing="-0.3">Most Used Languages</text>

  <!-- Continuous Segmented Progress Bar (Clipped with rounded ends) -->
  <g clip-path="url(#segmentedBarClip)">
    <rect x="36" y="68" width="448" height="10" fill="#1e293b"/>
    <rect x="36" y="68" width="203.9164895269937" height="10" fill="#f1e05a"/><rect x="239.9164895269937" y="68" width="184.16369836909254" height="10" fill="#3178c6"/><rect x="424.0801878960863" y="68" width="37.247276740821654" height="10" fill="#7057ff"/><rect x="461.3274646369079" y="68" width="17.60994314844891" height="10" fill="#e34c26"/><rect x="478.9374077853568" y="68" width="4.7746144021616574" height="10" fill="#555555"/><rect x="483.71202218751847" y="68" width="3" height="10" fill="#b07219"/><rect x="486.71202218751847" y="68" width="3" height="10" fill="#384d54"/>
  </g>

  <!-- 2 Column Language List -->
  
    <g class="lang-item" transform="translate(38, 108)">
      <circle cx="5" cy="-4.5" r="4.5" fill="#f1e05a"/>
      <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan font-weight="600" fill="#ffffff">JavaScript</tspan>
        <tspan dx="6" font-weight="600" fill="#2dd4bf">45.52%</tspan>
      </text>
    </g>
    <g class="lang-item" transform="translate(38, 134)">
      <circle cx="5" cy="-4.5" r="4.5" fill="#3178c6"/>
      <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan font-weight="600" fill="#ffffff">TypeScript</tspan>
        <tspan dx="6" font-weight="600" fill="#2dd4bf">41.11%</tspan>
      </text>
    </g>
    <g class="lang-item" transform="translate(38, 160)">
      <circle cx="5" cy="-4.5" r="4.5" fill="#7057ff"/>
      <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan font-weight="600" fill="#ffffff">CSS</tspan>
        <tspan dx="6" font-weight="600" fill="#2dd4bf">8.31%</tspan>
      </text>
    </g>
    <g class="lang-item" transform="translate(38, 186)">
      <circle cx="5" cy="-4.5" r="4.5" fill="#e34c26"/>
      <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan font-weight="600" fill="#ffffff">HTML</tspan>
        <tspan dx="6" font-weight="600" fill="#2dd4bf">3.93%</tspan>
      </text>
    </g>
  
    <g class="lang-item" transform="translate(270, 108)">
      <circle cx="5" cy="-4.5" r="4.5" fill="#555555"/>
      <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan font-weight="600" fill="#ffffff">C</tspan>
        <tspan dx="6" font-weight="600" fill="#2dd4bf">1.07%</tspan>
      </text>
    </g>
    <g class="lang-item" transform="translate(270, 134)">
      <circle cx="5" cy="-4.5" r="4.5" fill="#b07219"/>
      <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan font-weight="600" fill="#ffffff">Java</tspan>
        <tspan dx="6" font-weight="600" fill="#2dd4bf">0.05%</tspan>
      </text>
    </g>
    <g class="lang-item" transform="translate(270, 160)">
      <circle cx="5" cy="-4.5" r="4.5" fill="#384d54"/>
      <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <tspan font-weight="600" fill="#ffffff">Dockerfile</tspan>
        <tspan dx="6" font-weight="600" fill="#2dd4bf">0.01%</tspan>
      </text>
    </g>
</svg>