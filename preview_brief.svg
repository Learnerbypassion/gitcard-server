<svg xmlns="http://www.w3.org/2000/svg" width="530" height="420" viewBox="0 0 530 420" role="img">
  <title>Soham Bhattacharya Recruiter Signal Brief</title>
  <defs>
    <linearGradient id="briefBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="briefTopGlow" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="briefBottomGlow" cx="80%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="briefOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="briefInnerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Outer background & glowing border -->
  <rect x="1" y="1" width="528" height="418" rx="18" fill="#070913" stroke="url(#briefBorder)" stroke-width="1.5"/>

  <!-- Ambient auras -->
  <rect x="1" y="1" width="528" height="418" rx="18" fill="url(#briefTopGlow)" pointer-events="none"/>
  <rect x="1" y="1" width="528" height="418" rx="18" fill="url(#briefBottomGlow)" pointer-events="none"/>

  <!-- Animated roaming glowing orb -->
  <circle cx="200" cy="180" r="140" fill="url(#briefOrb)" pointer-events="none">
    <animate attributeName="cx" values="160;380;240;160" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="140;270;180;140" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner container box (height 380, cleanly encloses all content) -->
  <rect x="20" y="20" width="490" height="380" rx="14" fill="rgba(8, 12, 20, 0.65)" stroke="url(#briefInnerBorder)" stroke-width="1.2"/>

  <!-- Beacon badge -->
  <rect x="42" y="44" width="270" height="24" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8"/>
  <circle cx="55" cy="56" r="3.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="66" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="0.5">RECRUITER SIGNAL BRIEF · learnerbypassion</text>

  <!-- Name -->
  <text x="42" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Soham Bhattacharya</text>

  <!-- Role -->
  <text x="42" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#38bdf8">Frontend or full-stack engineer</text>

  <!-- Motto / description -->
  <text x="42" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Building useful software and sharing the work in public.</text>

  <!-- Status pill with pulsing dot -->
  <rect x="42" y="200" width="260" height="30" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <circle cx="58" cy="215" r="4" fill="#22c55e">
    <animate attributeName="r" values="3.5;4.5;3.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="70" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Building and sharing work in public</text>

  <!-- Divider line -->
  <line x1="42" y1="248" x2="488" y2="248" stroke="#1e293b" stroke-width="1"/>

  <!-- Tech tags -->
  <g transform="translate(42, 264)">
    <rect x="0" y="0" width="80" height="24" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="0.8"/>
    <text x="40" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">JavaScript</text>

    <rect x="88" y="0" width="56" height="24" rx="6" fill="rgba(45, 212, 191, 0.1)" stroke="rgba(45, 212, 191, 0.25)" stroke-width="0.8"/>
    <text x="116" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle">React</text>

    <rect x="152" y="0" width="76" height="24" rx="6" fill="rgba(192, 132, 252, 0.1)" stroke="rgba(192, 132, 252, 0.25)" stroke-width="0.8"/>
    <text x="190" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">HTML / CSS</text>

    <rect x="236" y="0" width="66" height="24" rx="6" fill="rgba(74, 222, 128, 0.1)" stroke="rgba(74, 222, 128, 0.25)" stroke-width="0.8"/>
    <text x="269" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#4ade80" text-anchor="middle">Node.js</text>
  </g>

  <!-- GitHub profile link button (Comfortably placed inside the inner box) -->
  <g transform="translate(42, 304)">
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#0b1120" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <circle cx="16" cy="15" r="3.5" fill="#38bdf8"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">github.com/learnerbypassion</text>
  </g>
</svg>