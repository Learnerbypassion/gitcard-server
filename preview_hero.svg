    </g>

    <!-- CRT scanline beam -->
    <rect x="526" y="78" width="264" height="24" fill="url(#heroScan)" pointer-events="none">
      <animate attributeName="y" values="78;282;78" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>