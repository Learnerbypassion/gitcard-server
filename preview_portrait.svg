  </g>

  <!-- CRT Scanline beam passing over the portrait -->
  <rect x="22" y="42" width="320" height="32" fill="url(#scanBeam)" pointer-events="none">
    <animate attributeName="y" values="40;358;40" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>