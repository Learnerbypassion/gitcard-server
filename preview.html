<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GitHub Proof Cards Preview</title>
  <style>
    body {
      background-color: #060911;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
    }
    .header {
      text-align: center;
    }
    .header h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .header p {
      margin: 0;
      font-size: 14px;
      color: #94a3b8;
    }
    .card-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      align-self: flex-start;
      margin-left: 10px;
    }
    .card-wrap {
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      background: #070913;
      overflow: hidden;
      display: flex;
    }
    img {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Learnerbypassion Live GitHub Cards</h1>
    <p>Real-time profile metrics, selected work &amp; technical toolkit with glowing ambient roaming orbs</p>
  </div>

  <div class="card-section">
    <div class="card-title">1. Profile Signal (Stats)</div>
    <div class="card-wrap">
      <img src="preview.svg" width="850" height="340" alt="Profile Signal" />
    </div>
  </div>

  <div class="card-section">
    <div class="card-title">2. Selected Work (Projects)</div>
    <div class="card-wrap">
      <img src="preview_projects.svg" width="850" height="400" alt="Selected Work" />
    </div>
  </div>

  <div class="card-section">
    <div class="card-title">3. Technical Toolkit (Language Stack)</div>
    <div class="card-wrap">
      <img src="preview_languages.svg" width="850" height="340" alt="Language Stack" />
    </div>
  </div>
</body>
</html>
